<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08080b" />

    <!--
      La página es pública: cualquiera con el link entra. No se puede evitar
      (GitHub Pages no tiene contraseña), pero al menos que no la indexe
      ningún buscador y que no se genere vista previa al compartir el link.
    -->
    <meta name="robots" content="noindex, nofollow, noarchive, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />

    <!--
      Las fuentes NO se piden a Google.

      Una <link rel="stylesheet"> a un dominio ajeno bloquea el pintado: hasta
      que esa hoja no baja, la pantalla queda en blanco. Medido acá, con la red
      lenta, eran 12,7 segundos de pantalla negra antes de que apareciera nada.

      Ahora viajan dentro del proyecto (ver src/index.css). Cero pedidos a
      terceros, cero bloqueo, y funcionan aunque Google esté lento.
    -->

    <title>Seis días de mayo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
